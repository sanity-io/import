name: Test
on:
  - pull_request

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the lowest pnpm will run on, so our declared 22.12 floor is not exercised here
        node: ['22.13.0', 'lts']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          runtime: node@${{ matrix.node }}

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Depcheck
        run: pnpm depcheck

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  # A matrix job reports one check per entry, so none of them is named `Test`. The `main` ruleset
  # requires a check by that exact name, so keep one here that gates on the whole matrix.
  test-result:
    name: Test
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check matrix result
        run: '[ "${{ needs.test.result }}" = "success" ]'
