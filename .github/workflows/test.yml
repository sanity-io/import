name: Test
on:
  - pull_request

env:
  # Matches minimum version for pnpm - higher than our 22.12 baseline (ok)
  NODE_VERSION: '22.13.0'

jobs:
  release:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Depcheck
        run: pnpm depcheck

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
